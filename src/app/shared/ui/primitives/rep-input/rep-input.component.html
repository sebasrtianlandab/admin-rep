<div class="rep-field" [class.rep-field--error]="error()" [class.rep-field--embedded]="embedded()">
  @if (label()) {
    <label class="rep-field__label rep-label" [attr.for]="fieldId()">{{ label() }}</label>
  }
  <input
    class="rep-field__control"
    [id]="fieldId()"
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [autocomplete]="autocomplete() ?? undefined"
    [(ngModel)]="value"
    (blur)="blurred.emit($event)"
    (focus)="focused.emit($event)"
  />
  @if (error()) {
    <p class="rep-field__error" role="alert">{{ error() }}</p>
  } @else if (helperText()) {
    <p class="rep-field__helper rep-caption">{{ helperText() }}</p>
  }
</div>
