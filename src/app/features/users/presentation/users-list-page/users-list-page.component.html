<app-rep-page-container>
  <app-rep-toolbar>
    <app-rep-page-header
      eyebrow="Operaciones"
      title="Usuarios"
      description="Soporte, riesgo y control de acceso. Datos simulados; las acciones destructivas requerirán API `/admin/users` y auditoría."
    />
    <div class="flex shrink-0 items-center gap-2">
      @if (snapshot(); as snap) {
        <app-rep-badge
          variant="outline"
          [label]="'Actualizado · ' + (snap.generatedAt | date : 'medium')"
        />
      }
      <app-rep-button variant="outline" size="md" [loading]="loading()" (clicked)="refresh()">
        <lucide-icon name="refresh-cw" [size]="16" [class.animate-spin]="loading()" />
        Actualizar
      </app-rep-button>
    </div>
  </app-rep-toolbar>

  @if (error(); as err) {
    <app-rep-error-state title="No se pudo cargar el módulo" [description]="err" />
  }

  <app-rep-section [ariaLabel]="'Indicadores'">
    <div class="rep-grid-kpi">
      @if (loading() && !snapshot()) {
        @for (i of [1, 2, 3, 4]; track i) {
          <app-rep-kpi-card label="…" value="—" [loading]="true" iconName="users" />
        }
      } @else {
        @if (snapshot(); as snap) {
          @for (k of snap.kpis; track k.id) {
            <app-rep-kpi-card
              [label]="k.label"
              [value]="k.value"
              [hint]="k.hint"
              [iconName]="k.icon"
              [trendLabel]="k.trendLabel"
              [trendPositive]="k.trendPositive"
            />
          }
        }
      }
    </div>
  </app-rep-section>

  <app-rep-section [ariaLabel]="'Listado'">
    <app-rep-card title="Cuentas" subtitle="Listado enterprise (mock)" [padding]="'sm'">
      <app-rep-table-toolbar>
        <div repTableToolbarStart class="min-w-0 flex-1">
          <app-rep-filter-bar
            [(search)]="search"
            searchPlaceholder="Buscar por id, email o roles…"
            [resetDisabled]="search().trim() === ''"
            (reset)="onFilterReset()"
          />
        </div>
      </app-rep-table-toolbar>
      <ng-template #userRowActions let-row let-index="index">
        <div class="flex justify-end gap-1">
          <app-rep-button variant="ghost" size="sm" [disabled]="true">Ver</app-rep-button>
          <app-rep-button
            variant="ghost"
            size="sm"
            [disabled]="isAccountBlocked(row)"
            (clicked)="openBlockConfirm(row)"
          >
            Bloquear
          </app-rep-button>
        </div>
      </ng-template>
      <app-rep-data-table
        [columns]="columns"
        [rows]="filteredRows()"
        [rowActions]="userRowActions"
        [loading]="loading() && !snapshot()"
        exportFileName="usuarios-admin"
        exportTitle="Usuarios"
        [emptyMode]="emptyMode()"
        emptyMessage="No hay usuarios en el mock."
        emptyDescription="Cuando exista API admin, aquí aparecerán todas las cuentas."
        [density]="'comfortable'"
        [paginationEnabled]="true"
        [pageSize]="8"
      />
    </app-rep-card>
  </app-rep-section>
</app-rep-page-container>

<app-rep-confirm-dialog
  [(open)]="confirmBlockOpen"
  titleText="Bloquear cuenta"
  [messageText]="
    'Se registrará en auditoría. Usuario: ' +
    (blockTarget()?.['email'] ?? blockTarget()?.['id'] ?? '—') +
    '. Requiere endpoint admin.'
  "
  confirmLabel="Confirmar (mock)"
  cancelLabel="Cancelar"
  confirmVariant="danger"
  (confirmed)="onBlockConfirmed()"
/>
