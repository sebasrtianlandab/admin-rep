<app-rep-page-container>
  <app-rep-toolbar>
    <app-rep-page-header
      eyebrow="Finanzas"
      title="Pagos"
      description="Conciliación y monitoreo. Hoy el portal expone `my/history` y webhooks; el listado global requerirá `/admin/payments`."
    />
    <div class="flex shrink-0 items-center gap-2">
      @if (snapshot(); as snap) {
        <app-rep-badge
          variant="outline"
          [label]="'Actualizado · ' + (snap.generatedAt | date : 'medium')"
        />
      }
      <app-rep-button variant="outline" size="md" [loading]="loading()" (clicked)="refresh()">
        <lucide-icon name="refresh-cw" [size]="16" [class.animate-spin]="loading()" />
        Actualizar
      </app-rep-button>
    </div>
  </app-rep-toolbar>

  @if (error(); as err) {
    <app-rep-error-state title="No se pudo cargar el módulo" [description]="err" />
  }

  <app-rep-section [ariaLabel]="'Indicadores'">
    <div class="rep-grid-kpi">
      @if (loading() && !snapshot()) {
        @for (i of [1, 2, 3, 4]; track i) {
          <app-rep-kpi-card label="…" value="—" [loading]="true" iconName="credit-card" />
        }
      } @else {
        @if (snapshot(); as snap) {
          @for (k of snap.kpis; track k.id) {
            <app-rep-kpi-card
              [label]="k.label"
              [value]="k.value"
              [hint]="k.hint"
              [iconName]="k.icon"
              [trendLabel]="k.trendLabel"
              [trendPositive]="k.trendPositive"
            />
          }
        }
      }
    </div>
  </app-rep-section>

  <app-rep-section [ariaLabel]="'Listado'">
    <app-rep-card title="Transacciones" subtitle="Listado enterprise (mock)" [padding]="'sm'">
      <app-rep-table-toolbar>
        <div repTableToolbarStart class="min-w-0 flex-1">
          <app-rep-filter-bar
            [(search)]="search"
            searchPlaceholder="Buscar id, usuario o gateway…"
            [resetDisabled]="search().trim() === ''"
            (reset)="onFilterReset()"
          />
        </div>
      </app-rep-table-toolbar>
      <ng-template #paymentRowActions let-row>
        <div class="flex justify-end">
          <app-rep-button
            variant="ghost"
            size="sm"
            [disabled]="!canRetry(row)"
            (clicked)="openRetryConfirm(row)"
          >
            Reintentar
          </app-rep-button>
        </div>
      </ng-template>
      <app-rep-data-table
        [columns]="columns"
        [rows]="filteredRows()"
        [rowActions]="paymentRowActions"
        [loading]="loading() && !snapshot()"
        [emptyMode]="emptyMode()"
        emptyMessage="Sin pagos en el mock."
        emptyDescription="Las acciones de reintegro exigen permisos y auditoría."
        [density]="'comfortable'"
        [paginationEnabled]="true"
        [pageSize]="8"
      />
    </app-rep-card>
  </app-rep-section>
</app-rep-page-container>

<app-rep-confirm-dialog
  [(open)]="confirmRetryOpen"
  titleText="Reintentar cobro"
  [messageText]="
    'Operación sensible. Pago ' + (retryTarget()?.['id'] ?? '—') + '. Solo vía API admin y doble control.'
  "
  confirmLabel="Confirmar (mock)"
  cancelLabel="Cancelar"
  confirmVariant="danger"
  (confirmed)="onRetryConfirmed()"
/>
