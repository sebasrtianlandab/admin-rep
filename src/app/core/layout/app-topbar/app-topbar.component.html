<header
  class="app-topbar flex h-[var(--rep-shell-header-height)] shrink-0 items-center justify-between gap-3 border-b border-border bg-background px-4 text-foreground"
>
  <div class="flex min-w-0 flex-1 items-center gap-2">
    <button
      type="button"
      class="app-topbar__rail-toggle inline-flex shrink-0 items-center justify-center text-foreground md:hidden"
      (click)="onMenu()"
      aria-label="Abrir menú"
    >
      <lucide-icon name="menu" class="size-4" />
    </button>
    <button
      type="button"
      class="app-topbar__rail-toggle hidden shrink-0 items-center justify-center text-foreground transition-colors md:inline-flex"
      [attr.aria-label]="collapsed() ? 'Expandir barra lateral' : 'Contraer barra lateral'"
      (click)="onToggleSidebar()"
    >
      <lucide-icon [name]="collapsed() ? 'chevrons-right' : 'chevrons-left'" class="size-4" />
    </button>
    <div class="h-4 w-px shrink-0 bg-border" aria-hidden="true"></div>
  </div>

  <div class="flex shrink-0 items-center gap-2">
    <div class="app-topbar__theme">
      <button
        type="button"
        class="app-topbar__theme-trigger inline-flex items-center justify-center text-foreground transition-colors hover:bg-accent"
        (click)="toggleThemeMenu()"
        aria-label="Cambiar tema"
      >
        <lucide-icon [name]="themeIcon()" class="size-4" />
      </button>

      @if (themeMenuOpen()) {
        <div class="app-topbar__theme-menu" role="menu" aria-label="Selector de tema">
          @for (option of themeOptions; track option.value) {
            <button
              type="button"
              class="app-topbar__theme-option"
              [class.app-topbar__theme-option--active]="theme.mode() === option.value"
              (click)="setTheme(option.value)"
            >
              <lucide-icon [name]="option.icon" class="size-4" />
              <span>{{ option.label }}</span>
            </button>
          }
        </div>
      }
    </div>
  </div>
</header>
